events {}

http {
    server {
        listen 8443 ssl;

        access_log /var/log/nginx/access.log;
        error_log  /var/log/nginx/error.log info;

        # Server identity
        ssl_certificate     /etc/nginx/certs/server/wrong_server.fullchain.crt;
        ssl_certificate_key /etc/nginx/certs/server/wrong_server.key;

        # Client Authentication NOT enforced
        ssl_verify_client off;

        # Max allowed certificate chain depth
        ssl_verify_depth 2;

        # Plain HTTP: TLS/mTLS trust is enforced at nginx (upstream boundary)
        location / {
            proxy_pass http://flask:5000;
        }
    }
}
