services:
  flask:
    restart: unless-stopped
    image: python:3.11-slim
    volumes:
      - ../../../app:/app
    working_dir: /app
    command: sh -lc "pip install --no-cache-dir flask==3.1.2 && python app.py"

  nginx:
    restart: unless-stopped
    image: nginx:stable
    ports:
      - "8443:8443"
    environment:
      - DOCKER_UID=${DOCKER_UID}
      - DOCKER_GID=${DOCKER_GID}
    command: sh -lc "
      chown -R ${DOCKER_UID}:${DOCKER_GID} /var/log/nginx;
      exec nginx -g 'daemon off;'"
    volumes:
      - ./case-nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../../certs/ca/root.crt:/etc/nginx/certs/ca/root.crt:ro
      - ./wrong_server.fullchain.crt:/etc/nginx/certs/server/wrong_server.fullchain.crt:ro
      - ./wrong_server.key:/etc/nginx/certs/server/wrong_server.key:ro
      - ../../../runlogs/nginx:/var/log/nginx
    depends_on:
      - flask